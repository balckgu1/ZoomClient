# ZoomClient Release 工作流
# 推送 v* 标签（如 v0.2.0）时自动构建 Windows 二进制并创建 GitHub Release
# 构建顺序：先构建前端产物 -> 再交给 GoReleaser 编译并打包（前端经 go:embed 内嵌）

name: Release

on:
  push:
    tags:
      - "v*"

# 创建 Release 与上传产物需要仓库写权限
permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # GoReleaser 依赖完整 git 历史与标签生成 changelog
          fetch-depth: 0

      - name: Setting Node.js env
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      # 先生成 web/frontend/dist，供 go:embed 打入二进制
      - name: Build frontend
        working-directory: web/frontend
        run: |
          npm ci
          npm run build

      - name: Setting go env
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true

      # 读取 .goreleaser.yml：交叉编译 Windows amd64、打包 zip、生成校验和与 changelog
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
