# ZoomClient CI 工作流
# 受影响检查路由：push 时全量运行，PR 时仅运行与变更相关的检查

name: Test & Lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "web/frontend/**"
      - "**.ts"
      - "**.tsx"
      - "**.json"
      - "**.css"
      - ".github/workflows/**"

jobs:
  # ── Go 测试：运行所有包的单元测试（含竞态检测） ──────────
  test:
    name: Unit test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setting go env
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true

      - name: Run unit test
        run: go test -count=1 ./...

  # ── Go Lint：golangci-lint 静态分析 ──────────────────────
  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setting go env
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          args: --timeout=5m
          # 仅检查本次变更引入的新问题；存量历史问题不阻断合并
          only-new-issues: true

  # ── 前端类型检查：TypeScript 编译验证 ────────────────────
  frontend-check:
    name: Frontend Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setting Node.js env
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install lib
        run: npm ci

      - name: Check TypeScript type
        run: npx tsc --noEmit
